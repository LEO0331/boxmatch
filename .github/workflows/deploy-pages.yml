name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Flutter 3.50 deprecates flutter/material.dart. Pin until migration to material_ui.
          flutter-version: '3.47.9'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        env:
          BOXMATCH_API_BASE_URL: ${{ secrets.BOXMATCH_API_BASE_URL }}
          BOXMATCH_ENABLE_TELEMETRY: ${{ vars.BOXMATCH_ENABLE_TELEMETRY || 'false' }}
          BOXMATCH_ENABLE_TRAFFIC_ADMIN: ${{ vars.BOXMATCH_ENABLE_TRAFFIC_ADMIN || 'false' }}
        run: |
          TELEMETRY_ENABLED=false
          TRAFFIC_ADMIN_ENABLED=false
          if [ "$BOXMATCH_ENABLE_TRAFFIC_ADMIN" = "true" ]; then
            TRAFFIC_ADMIN_ENABLED=true
          fi
          if [ "$BOXMATCH_ENABLE_TELEMETRY" = "true" ]; then
            TELEMETRY_ENABLED=true
          fi
          if [ -n "$BOXMATCH_API_BASE_URL" ]; then
            flutter build web --release --base-href /boxmatch/ \
              --dart-define=BOXMATCH_API_BASE_URL="$BOXMATCH_API_BASE_URL" \
              --dart-define=BOXMATCH_ENABLE_TELEMETRY="$TELEMETRY_ENABLED" \
              --dart-define=BOXMATCH_ENABLE_TRAFFIC_ADMIN="$TRAFFIC_ADMIN_ENABLED"
          else
            flutter build web --release --base-href /boxmatch/ \
              --dart-define=BOXMATCH_ENABLE_TELEMETRY="$TELEMETRY_ENABLED" \
              --dart-define=BOXMATCH_ENABLE_TRAFFIC_ADMIN="$TRAFFIC_ADMIN_ENABLED"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

