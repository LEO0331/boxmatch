name: Firestore Rules CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-reservation-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator test tools
        run: npm install --prefix "$RUNNER_TEMP/boxmatch-rules" --no-save --package-lock=false firebase-tools@15.34.2 firebase@12.0.0 @firebase/rules-unit-testing@5.0.0
      - name: Verify owner-only reads and server-only writes
        run: |
          export NODE_PATH="$RUNNER_TEMP/boxmatch-rules/node_modules"
          "$RUNNER_TEMP/boxmatch-rules/node_modules/.bin/firebase" emulators:exec --project demo-boxmatch-reservations --only firestore "node --test tools/firestore/reservation_rules.test.cjs"
