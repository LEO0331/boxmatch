<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Boxmatch helps exhibitions reduce food waste by matching surplus lunchboxes and drinks to nearby recipients for public pickup.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="index, follow, max-image-preview:large">

  <link rel="canonical" href="https://leo0331.github.io/boxmatch/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Boxmatch">
  <meta property="og:title" content="Boxmatch | Exhibition Surplus Food Matching">
  <meta property="og:description" content="Reduce exhibition food waste. Post surplus lunchboxes and drinks, reserve nearby pickup, and complete public handoff safely.">
  <meta property="og:url" content="https://leo0331.github.io/boxmatch/">
  <meta property="og:image" content="https://leo0331.github.io/boxmatch/social/boxmatch-og-card.png">
  <meta property="og:image" content="https://leo0331.github.io/boxmatch/social/boxmatch-og-card.svg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Boxmatch | Exhibition Surplus Food Matching">
  <meta name="twitter:description" content="A lightweight platform to match exhibition surplus food for public pickup and reduce waste.">
  <meta name="twitter:image" content="https://leo0331.github.io/boxmatch/social/boxmatch-og-card.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="boxmatch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Boxmatch | Exhibition Surplus Food Matching</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --seed: #2d6a4f;
      --warm-bg: #f6f9f5;
      --ink: #223125;
      --muted: #5e6f61;
      --card: #ffffff;
      --ring: #d7e6d8;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--warm-bg);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #boot-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 15%, #e6f2e8 0%, transparent 40%),
        radial-gradient(circle at 80% 85%, #eaf5ec 0%, transparent 45%),
        var(--warm-bg);
      transition: opacity 220ms ease;
      z-index: 9999;
    }
    #boot-shell.hide {
      opacity: 0;
      pointer-events: none;
    }
    .boot-card {
      width: min(420px, 90vw);
      border: 1px solid var(--ring);
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(34, 49, 37, 0.06);
    }
    .boot-title {
      font-size: 24px;
      margin: 0 0 8px 0;
      letter-spacing: 0.2px;
    }
    .boot-subtitle {
      margin: 0 0 14px 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 14px;
    }
    .boot-progress {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #edf4ee;
    }
    .boot-progress > span {
      display: block;
      width: 35%;
      height: 100%;
      background: var(--seed);
      border-radius: inherit;
      animation: boot-load 1.2s ease-in-out infinite;
    }
    .boot-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    @keyframes boot-load {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>
<body>
  <div id="boot-shell" aria-live="polite">
    <div class="boot-card">
      <h1 class="boot-title">Boxmatch</h1>
      <p class="boot-subtitle">正在載入展場剩食媒合平台，首次開啟可能需要幾秒鐘。</p>
      <div class="boot-progress"><span></span></div>
      <div class="boot-hint">Loading app assets from GitHub Pages...</div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Boxmatch",
      "url": "https://leo0331.github.io/boxmatch/",
      "logo": "https://leo0331.github.io/boxmatch/icons/Icon-512.png",
      "description": "A lightweight exhibition surplus-food matching platform."
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Boxmatch",
      "url": "https://leo0331.github.io/boxmatch/"
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Boxmatch | Exhibition Surplus Food Matching",
      "url": "https://leo0331.github.io/boxmatch/",
      "description": "Match surplus lunchboxes and drinks from exhibitions to nearby recipients for public pickup."
    }
  </script>
</body>
</html>
